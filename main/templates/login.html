<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <!-- Подключаем Bootstrap 5 -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="card login-card shadow-sm p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">Авторизация</h3>
            <p class="text-muted small">Введите данные для входа в панель управления</p>
        </div>

        <!-- Форма авторизации -->
        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Вывод ошибок валидации (например, неправильный логин/пароль) -->
            {% if form.errors %}
                <div class="alert alert-danger p-2 small" role="alert">
                    Неверное имя пользователя или пароль. Попробуйте еще раз.
                </div>
            {% endif %}

            <!-- Поле Логина -->
            <div class="mb-3">
                <label for="{{ form.username.id_for_label }}" class="form-label text-secondary small fw-bold">Имя пользователя</label>
                <input type="text"
                       name="{{ form.username.name }}"
                       id="{{ form.username.id_for_label }}"
                       class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                       placeholder="Например: admin_super"
                       required>
            </div>

            <!-- Поле Пароля -->
            <div class="mb-4">
                <label for="{{ form.password.id_for_label }}" class="form-label text-secondary small fw-bold">Пароль</label>
                <input type="password"
                       name="{{ form.password.name }}"
                       id="{{ form.password.id_for_label }}"
                       class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                       placeholder="••••••••"
                       required>
            </div>

            <!-- Кнопка отправки формы -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-2">Войти</button>

            <!-- Кнопка отмены -->
            <a href="{% url 'index_page' %}" class="btn btn-outline-secondary w-100 py-2 small">На главную</a>
        </form>
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
